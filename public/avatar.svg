<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c28" />
      <stop offset="100%" stop-color="#0c0c12" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a51" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,42,81,0.22)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#avatarGrad)" />
  <circle cx="200" cy="170" r="130" fill="url(#ambientGlow)" />
  
  <!-- Sleek Architectural Frame -->
  <rect x="12" y="12" width="376" height="376" rx="28" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  
  <!-- Candidate Portrait Silhouette -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head silhouette -->
    <circle cx="200" cy="145" r="52" fill="#13131c" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <!-- Monogram inside avatar -->
    <text x="200" y="157" font-family="'Syne', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">UK</text>
    <!-- Torso / Shoulders -->
    <path d="M110 300 C110 235, 155 225, 200 225 C245 225, 290 235, 290 300" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="#101018" />
  </g>
  
  <!-- Candidate Status Pill -->
  <g transform="translate(95, 325)">
    <rect width="210" height="36" rx="18" fill="#181824" stroke="rgba(255,42,81,0.4)" stroke-width="1" />
    <circle cx="24" cy="18" r="4" fill="#ff2a51" />
    <text x="36" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#ffffff" letter-spacing="1">GALI UDAY KIRAN</text>
  </g>
</svg>
