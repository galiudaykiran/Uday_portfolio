<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a51" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,42,81,0.25)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#avatarGrad)" />
  <circle cx="200" cy="180" r="140" fill="url(#ambientGlow)" />
  
  <!-- Sleek Architectural Frame -->
  <rect x="12" y="12" width="376" height="376" rx="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Candidate Portrait Silhouette -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head silhouette -->
    <circle cx="200" cy="150" r="54" fill="#14141e" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <!-- Monogram inside avatar -->
    <text x="200" y="162" font-family="'Syne', sans-serif" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">UK</text>
    <!-- Torso / Shoulders -->
    <path d="M100 310 C100 240, 150 230, 200 230 C250 230, 300 240, 300 310" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" fill="#101018" />
  </g>
  
  <!-- Badge Pill -->
  <g transform="translate(110, 335)">
    <rect width="180" height="34" rx="17" fill="#1e1e2c" stroke="rgba(255,42,81,0.4)" stroke-width="1" />
    <circle cx="24" cy="17" r="4" fill="#ff2a51" />
    <text x="36" y="21" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ffffff" letter-spacing="1">GALI UDAY KIRAN</text>
  </g>
</svg>
